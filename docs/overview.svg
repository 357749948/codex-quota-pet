  <text x="36" y="75" font-family="Segoe UI, sans-serif" font-size="14" fill="#9aa8ba">Local quota → passive screen overlay</text>
  <rect x="42" y="116" width="215" height="74" rx="12" fill="#202936" stroke="#4a596d"/>
  <text x="149" y="145" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#edf4fb">Codex CLI</text>
  <text x="149" y="169" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#9aa8ba">Existing local login</text>
  <path d="M280 154 H390 M380 144 L391 154 L380 164" fill="none" stroke="#74d5c1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
